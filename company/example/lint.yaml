# Линтер публикуемых текстов компании: коммиты, PR, комментарии Jira. Списки этого файла складываются со списками
# lint.yaml пакета команды и lintNames личных настроек.
# Встроенные правила: телефоны, адреса почты, токены и JWT блокируют публикацию, русское написание Keycloak
# исправляется на латиницу. Е с точками, длинное тире и типографские кавычки линтер исправляет, только если так велит
# личный стиль (style в личных настройках).
#
# names - имена и фамилии сотрудников, которых нельзя упоминать в публичных текстах (нужна роль).
# Совпадение ищется по началу слова плюс до трех букв окончания, поэтому "Петров" найдет "Петровым".
# Если в падежах основа меняется (беглая гласная), укажите обе основы: "Павел" и "Павл", "Лев" и "Льв".
# Короткие имена могут задевать обычные слова: "Лев" найдет и "левый".
names: []
# allowEmails - адреса, которые упоминать можно.
allowEmails: []
